name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pawlodge
          POSTGRES_PASSWORD: pawlodge
          POSTGRES_DB: pawlodge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pawlodge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run unit tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://pawlodge:pawlodge@127.0.0.1:5432/pawlodge_test
        run: pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose images
        run: docker compose -f docker-compose.dev.yml build

  aws-auth:
    needs: test
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Verify prod ODIC_ROLE secret
        env:
          ODIC_ROLE: ${{ secrets.ODIC_ROLE }}
        run: |
          set -euo pipefail

          if [ -z "${ODIC_ROLE}" ]; then
            echo "::error::secrets.ODIC_ROLE is empty in the 'prod' environment."
            echo "Add ODIC_ROLE as an Environment secret on Settings → Environments → prod"
            echo "(not only as a Repository secret), or ensure the name matches exactly."
            exit 1
          fi

          # Safe fingerprint only — never print the full secret value.
          ROLE_LEN="${#ODIC_ROLE}"
          ROLE_PREFIX="${ODIC_ROLE:0:20}"
          ROLE_SUFFIX="${ODIC_ROLE: -12}"

          echo "environment=prod"
          echo "ODIC_ROLE length=${ROLE_LEN}"
          echo "ODIC_ROLE prefix=${ROLE_PREFIX}..."
          echo "ODIC_ROLE suffix=...${ROLE_SUFFIX}"

          if [[ "${ODIC_ROLE}" != arn:aws:iam::*:role/* ]]; then
            echo "::error::ODIC_ROLE does not look like an IAM role ARN (arn:aws:iam::<account>:role/<name>)."
            exit 1
          fi

      - name: Show OIDC subject claim
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com')
            const payload = token.split('.')[1]
            const padded = payload + '='.repeat((4 - (payload.length % 4)) % 4)
            const claims = JSON.parse(Buffer.from(padded, 'base64').toString('utf8'))
            core.info(`OIDC sub=${claims.sub}`)
            core.info(`OIDC aud=${claims.aud}`)
            if (claims.sub.includes('@')) {
              core.warning(
                'This repo emits IMMUTABLE OIDC subjects. Legacy trust values like ' +
                'repo:ashen-v2/paw-lodge:... will NOT match. Update the IAM role trust ' +
                'policy sub to the exact value above (includes @ownerId/@repoId).'
              )
            }
            core.info(
              'Required IAM Condition example:\n' +
              JSON.stringify({
                StringEquals: {
                  'token.actions.githubusercontent.com:aud': 'sts.amazonaws.com',
                  'token.actions.githubusercontent.com:sub': claims.sub,
                },
              }, null, 2)
            )

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ODIC_ROLE }}
          aws-region: ap-southeast-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

  terraform:
    needs: aws-auth
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      postgres_url: ${{ steps.tf.outputs.postgres_url }}
      app_instance_id: ${{ steps.tf.outputs.app_instance_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ODIC_ROLE }}
          aws-region: ap-southeast-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init, apply, and capture outputs
        id: tf
        working-directory: terraform
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
        run: |
          set -euo pipefail
          terraform init
          terraform apply -auto-approve

          POSTGRES_URL="$(terraform output -raw postgres_url)"
          APP_INSTANCE_ID="$(terraform output -raw app_instance_id)"

          echo "::add-mask::${POSTGRES_URL}"
          echo "postgres_url=${POSTGRES_URL}" >> "$GITHUB_OUTPUT"
          echo "app_instance_id=${APP_INSTANCE_ID}" >> "$GITHUB_OUTPUT"

  ssm:
    needs: terraform
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::016467578513:role/github-actions-paw-lodge
          aws-region: ap-southeast-1

      - name: Clone app onto EC2 via SSM
        env:
          POSTGRES_URL: ${{ needs.terraform.outputs.postgres_url }}
          APP_INSTANCE_ID: ${{ needs.terraform.outputs.app_instance_id }}
        run: |
          set -euo pipefail

          jq -n --arg db "${POSTGRES_URL}" '{
            commands: [
              "set -euo pipefail",
              "command -v git >/dev/null || dnf install -y git",
              "cd /home/ec2-user",
              "if [ -d app ]; then rm -rf app; fi",
              "git clone https://github.com/ashen-v2/paw-lodge.git app",
              "chown -R ec2-user:ec2-user app",
              "if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then",
              "  cd /home/ec2-user/app",
              ("  export DATABASE_URL=" + ($db | @sh)),
              "  docker compose -f docker-compose.prod.yml up -d --build",
              "else",
              "  echo \"Docker or Docker Compose not installed; skipping compose up\"",
              "fi"
            ]
          }' > /tmp/ssm-params.json

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${APP_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Refresh /home/ec2-user/app and start prod compose" \
            --parameters "file:///tmp/ssm-params.json" \
            --query "Command.CommandId" \
            --output text)"

          echo "SSM command id: ${COMMAND_ID}"

          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${APP_INSTANCE_ID}"

          STATUS="$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${APP_INSTANCE_ID}" \
            --query "Status" \
            --output text)"

          echo "SSM command status: ${STATUS}"

          if [ "${STATUS}" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${APP_INSTANCE_ID}" \
              --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
              --output json
            exit 1
          fi
