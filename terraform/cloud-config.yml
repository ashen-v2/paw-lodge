#cloud-config
package_update: true

runcmd:
  # Latest Docker Engine via Docker's convenience script (avoids stale AL2023 dnf packages).
  - curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
  - sh /tmp/get-docker.sh
  - systemctl enable --now docker
  - usermod -aG docker ec2-user
  # Pin Compose plugin to the latest GitHub release (dnf/plugin packages lag and break).
  - mkdir -p /usr/libexec/docker/cli-plugins /usr/local/lib/docker/cli-plugins
  - curl -fsSL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m)" -o /usr/libexec/docker/cli-plugins/docker-compose
  - chmod +x /usr/libexec/docker/cli-plugins/docker-compose
  - ln -sfn /usr/libexec/docker/cli-plugins/docker-compose /usr/local/lib/docker/cli-plugins/docker-compose
  - docker --version
  - docker compose version
